name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ─── 1. Lint & Type-Check ────────────────────────────────────────────────────
  lint:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install workspace dependencies
        run: npm ci --workspaces

      - name: Lint frontend
        run: npm run lint -w apps/frontend

      - name: Lint admin
        run: npm run lint -w apps/admin

      - name: Type-check frontend
        run: npx tsc --noEmit -p apps/frontend/tsconfig.json

      - name: Type-check admin
        run: npx tsc --noEmit -p apps/admin/tsconfig.json

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/backend

      - name: Type-check backend
        run: npx tsc --noEmit -p apps/backend/tsconfig.build.json

  # ─── 2. Backend Tests ────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frames41_test
          POSTGRES_PASSWORD: frames41_test
          POSTGRES_DB: frames41_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://frames41_test:frames41_test@localhost:5432/frames41_test?schema=public
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-access-secret-key-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-key-at-least-32-characters
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 30d
      RAZORPAY_WEBHOOK_SECRET: ci-razorpay-webhook-secret-key-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install backend dependencies
        run: npm ci -w apps/backend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/backend

      - name: Run DB migrations
        run: npx prisma migrate deploy
        working-directory: apps/backend

      - name: Run unit tests
        run: npm test -w apps/backend

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: apps/backend/coverage/
          retention-days: 14

  # ─── 3. Build Validation ─────────────────────────────────────────────────────
  build:
    name: Build All Workspaces
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --workspaces

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/backend

      - name: Build backend
        run: npm run build -w apps/backend

      - name: Build frontend
        run: npm run build -w apps/frontend

      - name: Build admin
        run: npm run build -w apps/admin

      - name: Validate frontend bundle size
        run: |
          MAIN_JS=$(find apps/frontend/dist/assets -name "index-*.js" | head -1)
          SIZE=$(wc -c < "$MAIN_JS")
          echo "Main bundle size: ${SIZE} bytes ($(echo "scale=1; $SIZE/1024" | bc) kB)"
          if [ "$SIZE" -gt 409600 ]; then
            echo "FAIL Main bundle too large: ${SIZE} bytes. Budget is 400 kB."
            exit 1
          fi
          echo "PASS Bundle size within budget."

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: apps/frontend/dist/
          retention-days: 7

      - name: Upload admin build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist-${{ github.sha }}
          path: apps/admin/dist/
          retention-days: 7

  # ─── 4. Security Audit ───────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Audit root dependencies
        run: npm audit --audit-level=critical || true

      - name: Audit backend dependencies
        run: npm audit --audit-level=critical || true
        working-directory: apps/backend

      - name: Audit frontend dependencies
        run: npm audit --audit-level=critical || true
        working-directory: apps/frontend
