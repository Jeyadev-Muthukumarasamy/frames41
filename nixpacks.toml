[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm --prefix apps/frontend ci", "npm --prefix apps/backend ci"]

[phases.build]
cmds = [
  "npm --prefix apps/frontend run build",
  "npx prisma generate --schema=apps/backend/prisma/schema.prisma",
  "npm --prefix apps/backend run build:backend",
]

[start]
cmd = "cd apps/backend && npx prisma migrate deploy && node dist/src/server.js"
